# Stack de produção: Chatwoot (dono do canal) + Agent Bot + Postgres + Redis + Caddy (HTTPS).
# Uso: ver docs/08-habilitacao-e-producao.md, seção 4.
name: nebula-atendimento

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
  env_file: .env
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    RAILS_LOG_TO_STDOUT: "true"
    POSTGRES_HOST: postgres
    POSTGRES_USERNAME: chatwoot
    POSTGRES_DATABASE: chatwoot
    REDIS_URL: redis://redis:6379
  volumes:
    - storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  rails:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    # Chatwoot 4.x exige a extensão pgvector.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_DB: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # Agent Bot (código próprio, fora deste repositório). Descomente e aponte
  # para a imagem publicada. Ele só precisa ser alcançável pelo Chatwoot na
  # rede interna: http://agent-bot:3001/webhook
  # agent-bot:
  #   image: ghcr.io/SEU_USUARIO/nebula-agent-bot:latest
  #   env_file: .env.bot
  #   restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CHATWOOT_DOMAIN: ${CHATWOOT_DOMAIN:?defina CHATWOOT_DOMAIN no .env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rails
    restart: unless-stopped

volumes:
  storage:
  postgres:
  redis:
  caddy_data:
  caddy_config:
